name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kingdom-of-choices.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-of-choices-apk
          path: out/kingdom-of-choices.apk

      - name: Publish Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: آخرین نسخه (APK)
          body: |
            آخرین فایل APK بازی «پادشاه انتخاب‌ها» از شاخه main.
            ساخته‌شده به‌صورت خودکار توسط GitHub Actions.
          files: out/kingdom-of-choices.apk
          prerelease: false

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/kingdom-of-choices.apk
